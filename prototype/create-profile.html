<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Profile — Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <span>ArtSpace</span>
      <a class="back" href="home.html">&larr; back</a>
    </div>
    <div class="screen-label">SCREEN 2 — ARTIST: CREATE PROFILE</div>
    <div class="content">
      <h1>Set up your profile</h1>
      <p>Venues will see this when you apply.</p>

      <div class="field">
        <label>Name</label>
        <div class="input">Your name</div>
      </div>
      <div class="field">
        <label>Art style / medium</label>
        <div class="input">e.g. acrylic painting, photography</div>
      </div>
      <div class="field">
        <label>Portfolio images</label>
        <div class="placeholder-img" style="height:90px;">[ upload artwork ]</div>
      </div>
      <div class="field">
        <label>Short bio</label>
        <div class="input" style="height:50px;">Tell venues about you</div>
      </div>

      <div class="spacer"></div>
      <a class="btn" href="browse-venues.html">Save &amp; continue</a>
    </div>
    <div class="note">Unscripted prototype — no further instructions given</div>
  </div>
</body>
</html>
